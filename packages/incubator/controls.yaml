# =============================================================================
# Voice Incubator — controls package
#
# A copy of packages/core/controls.yaml. Only the action of one press differs
# (button_action below): it acts on the Voice Incubator call, not on the voice
# assistant. The Voice PE behavior of the user button: actions on one press,
# events on two presses, three presses, and a long press, and the factory reset.
#
# Include this package only if the device has a user button. The device
# packages must supply these IDs:
#   binary_sensor  user_button          (the hardware only: platform, pin, filters)
#   script         control_leds_status_off,
#                  control_leds_factory_reset_coming_up,
#                  control_leds_factory_reset_confirmed
#
# dial_touched, color_changed, and group_volume_changed stay false on a device
# without a dial. A dial package sets them, as on the Voice PE.
# =============================================================================

substitutions:
  # The button sounds. Only this package plays them, so a device without a
  # user button does not embed them. Override one to use your own sound.
  center_button_press_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-ESPHome-integration/${satellite_core_ref}/sounds/center_button_press.opus
  center_button_double_press_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-ESPHome-integration/${satellite_core_ref}/sounds/center_button_double_press.opus
  center_button_triple_press_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-ESPHome-integration/${satellite_core_ref}/sounds/center_button_triple_press.opus
  center_button_long_press_sound_file: https://raw.githubusercontent.com/formatBCE/Respeaker-ESPHome-integration/${satellite_core_ref}/sounds/center_button_long_press.opus

audio_file:
  - id: center_button_press_sound
    file: ${center_button_press_sound_file}
  - id: center_button_double_press_sound
    file: ${center_button_double_press_sound_file}
  - id: center_button_triple_press_sound
    file: ${center_button_triple_press_sound_file}
  - id: center_button_long_press_sound
    file: ${center_button_long_press_sound_file}

globals:
  # Global variable storing if a factory reset was requested. If it is set to true, the device will factory reset once the center button is released
  - id: factory_reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'

  # Global variable tracking if the dial was recently touched.
  - id: dial_touched
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the LED color was recently changed.
  - id: color_changed
    type: bool
    restore_value: no
    initial_value: 'false'
  # Global variable tracking if the group media player volume was recent changed.
  - id: group_volume_changed
    type: bool
    restore_value: no
    initial_value: 'false'

switch:
  # Button click Sounds Switch.
  - platform: template
    id: button_sound
    name: Button click sounds
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
  # Disable physical controls switch
  - platform: template
    id: disable_buttons
    name: Disable physical controls
    icon: "mdi:button-pointer"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    disabled_by_default: true

binary_sensor:
  # User Button. Used for many things (See on_multi_click)
  # The device package defines the hardware of user_button.
  - id: !extend user_button
    on_press:
      - if:
          condition:
            switch.is_off: disable_buttons
          then:
            - script.execute: control_leds
    on_release:
      - if:
          condition:
            switch.is_off: disable_buttons
          then:
            - script.execute: control_leds
      # If a factory reset is requested, factory reset on release
      - if:
          condition:
            lambda: return id(factory_reset_requested);
          then:
            - button.press: factory_reset_button
    on_multi_click:
      # Simple Click: button_action.
      - timing:
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed) && !id(disable_buttons).state;
              then:
                - script.execute: button_action
      # Double Click
      #  . Exposed as an event entity. To be used in automations inside Home Assistant
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed) && !id(disable_buttons).state;
              then:
                - if:
                    condition:
                      switch.is_on: button_sound
                    then:
                      - script.execute:
                          id: play_sound
                          priority: false
                          sound_file: "center_button_double_press_sound"
                - event.trigger:
                    id: button_press_event
                    event_type: "double_press"
      # Triple Click
      #  . Exposed as an event entity. To be used in automations inside Home Assistant
      - timing:
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at most 0.25s
          - ON for at most 1s
          - OFF for at least 0.25s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed) && !id(disable_buttons).state;
              then:
                - if:
                    condition:
                      switch.is_on: button_sound
                    then:
                      - script.execute:
                          id: play_sound
                          priority: false
                          sound_file: "center_button_triple_press_sound"
                - event.trigger:
                    id: button_press_event
                    event_type: "triple_press"
      # Long Press
      #  . Exposed as an event entity. To be used in automations inside Home Assistant
      - timing:
          - ON for at least 1s
        then:
          - if:
              condition:
                lambda: return !id(init_in_progress) && !id(color_changed) && !id(group_volume_changed) && !id(disable_buttons).state;
              then:
                - if:
                    condition:
                      switch.is_on: button_sound
                    then:
                      - script.execute:
                          id: play_sound
                          priority: false
                          sound_file: "center_button_long_press_sound"
                - script.execute: control_leds_status_off
                - event.trigger:
                    id: button_press_event
                    event_type: "long_press"
      # Factory Reset Warning
      #  . Audible and Visible warning.
      - timing:
          - ON for at least 10s
        then:
          - if:
              condition:
                lambda: return !id(dial_touched);
              then:
                - script.execute: control_leds_factory_reset_coming_up
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "factory_reset_initiated_sound"
                - wait_until:
                    binary_sensor.is_off: user_button
                - if:
                    condition:
                      lambda: return !id(factory_reset_requested);
                    then:
                      - script.execute: control_leds_status_off
                      - script.execute:
                          id: play_sound
                          priority: true
                          sound_file: "factory_reset_cancelled_sound"
      # Factory Reset Confirmed.
      #  . Audible warning to prompt user to release the button
      #  . Set factory_reset_requested to true
      - timing:
          - ON for at least 22s
        then:
          - if:
              condition:
                lambda: return !id(dial_touched);
              then:
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "factory_reset_confirmed_sound"
                - script.execute: control_leds_factory_reset_confirmed
                - lambda: id(factory_reset_requested) = true;

event:
  # Event entity exposed to the user to automate on complex center button presses.
  # The simple press is not exposed as it is used to control the device itself.
  - platform: template
    id: button_press_event
    name: "Button press"
    icon: mdi:button-pointer
    device_class: button
    event_types:
      - double_press
      - triple_press
      - long_press

script:
  # One press. Stops the first of these that runs: a ringing timer (the app
  # hears it), the intercom, the call, an announcement, the music. With none,
  # it starts a call, if the device is not muted.
  - id: button_action
    then:
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - voice_incubator.send_event: stop_timer
            - switch.turn_off: timer_ringing
            - script.execute: stop_announcement
          else:
            - if:
                condition:
                  voice_incubator.is_intercom:
                then:
                  - voice_incubator.end_intercom:
                  - script.execute: duck_music
                  - script.execute: set_idle_phase
                else:
                  - if:
                      condition:
                        voice_incubator.is_in_call:
                      then:
                        - voice_incubator.cancel:
                        - script.execute: stop_announcement
                      else:
                        - if:
                            condition:
                              media_player.is_announcing: external_media_player
                            then:
                              - script.execute: stop_announcement
                            else:
                              - if:
                                  condition:
                                    media_player.is_playing: external_media_player
                                  then:
                                    - media_player.pause: external_media_player
                                  else:
                                    - if:
                                        condition:
                                          switch.is_off: mic_mute_switch
                                        then:
                                          - if:
                                              condition:
                                                switch.is_on: button_sound
                                              then:
                                                - script.execute:
                                                    id: play_sound
                                                    priority: true
                                                    sound_file: "center_button_press_sound"
                                                - delay: 300ms
                                          - voice_incubator.start: manual
