# =============================================================================
# Voice Incubator — ReSpeaker Lite board package (Lite and Koala)
#
# The incubator behavior on top of packages/respeaker-lite/hardware.yaml: the
# XMOS mute and the user button. The device package supplies user_button
# (platform, pin, filters).
#
# The button:
#   - a press (at most 1 s): button_action of the core.
#   - a hold of 10 s: factory reset warning. Release before 22 s cancels it.
#   - a hold of 22 s: factory reset confirmed. The reset runs on release.
# =============================================================================

globals:
  # Button hold: 0 = none, 1 = warning (10 s), 2 = confirmed (22 s).
  - id: factory_reset_phase
    type: int
    restore_value: no
    initial_value: '0'

switch:
  # While the XMOS mute is on, the microphones are muted in software too, so
  # no wake word and no call can hear anything.
  - id: !extend mic_mute_switch
    on_turn_on:
      - microphone.mute: i2s_mics_raw
      - script.execute: control_leds
    on_turn_off:
      - microphone.unmute: i2s_mics_raw
      - script.execute: control_leds

binary_sensor:
  - id: !extend user_button
    on_click:
      - max_length: 1s
        then:
          - script.execute: button_action
    on_release:
      - if:
          condition:
            lambda: return id(factory_reset_phase) == 2;
          then:
            - button.press: factory_reset_button
    on_multi_click:
      - timing:
          - ON for at least 10s
        then:
          - lambda: id(factory_reset_phase) = 1;
          - script.execute: control_leds
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "factory_reset_initiated_sound"
          - wait_until:
              binary_sensor.is_off: user_button
          - if:
              condition:
                lambda: return id(factory_reset_phase) != 2;
              then:
                - lambda: id(factory_reset_phase) = 0;
                - script.execute: control_leds
                - script.execute:
                    id: play_sound
                    priority: true
                    sound_file: "factory_reset_cancelled_sound"
      - timing:
          - ON for at least 22s
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "factory_reset_confirmed_sound"
          - lambda: id(factory_reset_phase) = 2;
          - script.execute: control_leds
