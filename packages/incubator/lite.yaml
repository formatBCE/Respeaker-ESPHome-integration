# =============================================================================
# Voice Incubator — Respeaker Lite device package
#
# The XIAO ESP32-S3: the flash size, the user button pin, and the single RGB
# LED. Each LED state of the core is one effect of the same name on led_internal.
# The effects take their color from the call (the recognized speaker, else
# purple) or from the "LED Respeaker onboard" light.
# =============================================================================

substitutions:
  incubator_model: respeaker-lite
  # The LED light's color as 0xRRGGBB: amber at night, but for a ringing timer.
  led_rgb: "(id(night) && !id(timer_ringing) ? 0xFF4000 : int(id(led_respeaker_onboard).current_values.get_red() * 255) << 16 | int(id(led_respeaker_onboard).current_values.get_green() * 255) << 8 | int(id(led_respeaker_onboard).current_values.get_blue() * 255))"
  # A call's color: the recognized speaker's, else purple; amber at night.
  call_rgb: "(id(night) ? 0xFF4000 : id(speaker_rgb) >= 0 ? id(speaker_rgb) : 0xFF33FF)"

esphome:
  project:
    name: formatbce.Respeaker Lite Incubator
    version: dev

esp32:
  flash_size: 8MB
  framework:
    advanced:
      # The XIAO ESP32-S3 has GigaDevice flash. Link only that driver to save
      # IRAM; another vendor falls back to the generic driver.
      flash_chip: gd

binary_sensor:
  - platform: gpio
    id: user_button
    pin:
      number: GPIO3 # D2
      inverted: true
    filters:
      - delayed_on: 50ms
      - delayed_off: 50ms
    name: "User button"

script:
  # Draws a core LED state, unless a failed XMOS or a factory reset hold wins.
  - id: led_show
    mode: restart
    parameters:
      state: string
    then:
      - lambda: |-
          std::string effect = state;
          if (id(respeaker).is_failed()) {
            effect = "Failed";
          } else if (id(factory_reset_phase) == 2) {
            effect = "Reset Confirmed";
          } else if (id(factory_reset_phase) == 1) {
            effect = "Reset Coming Up";
          }
          if (effect == "Idle") {
            id(led_internal).turn_off().perform();
            // Dark at night, the LED light aside.
            if (id(led_respeaker_onboard).remote_values.is_on() && !id(night))
              id(led_respeaker_onboard).turn_on().perform();
            return;
          }
          float brightness = id(night) && !id(timer_ringing)
              ? 0.2f : std::max(id(led_respeaker_onboard).current_values.get_brightness(), 0.2f);
          if (effect == "Answered Elsewhere") {
            brightness = id(night) ? 0.2f : 0.25f;
          } else if (effect == "Failed" || effect == "Reset Confirmed" || effect == "Reset Coming Up") {
            brightness = 1.0f;
          }
          auto call = id(led_internal).turn_on();
          call.set_brightness(brightness);
          call.set_effect(effect);
          call.perform();

respeaker_lite:
  firmware:
    on_begin:
      - light.turn_on:
          id: led_internal
          brightness: 50%
          effect: "Updating"
    on_end:
      - light.turn_on:
          id: led_internal
          brightness: 50%
          effect: "Updated"
      - delay: 3s
      - script.execute: control_leds
    on_error:
      - light.turn_on:
          id: led_internal
          brightness: 50%
          effect: "Update Failed"
      - delay: 3s
      # The component is failed now, so control_leds keeps the failure state on.
      - script.execute: control_leds

light:
  - platform: esp32_rmt_led_strip
    id: led_internal
    internal: true
    channel_colors: GRB
    pin: GPIO1
    num_leds: 1
    rmt_symbols: 192
    # Explicit timings, as on the Voice PE. The ws2812 preset sends no reset,
    # and newer LEDs drop a frame that follows the last one within 280 us (#88).
    bit0_high: 300ns
    bit0_low: 975ns
    bit1_high: 650ns
    bit1_low: 650ns
    reset_low: 300us
    reset_high: 0us
    max_refresh_rate: 15ms
    default_transition_length: 0s
    effects:
      # Wi-Fi is given over Bluetooth: a warm white pulse.
      - addressable_lambda:
          name: "Improv"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 2000.0f);
            it[0] = Color(0xFFE3B5) * uint8_t(f * 255);
      # Starting up, on Wi-Fi: a blue pulse.
      - addressable_lambda:
          name: "Starting"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 2000.0f);
            it[0] = Color(0x18BBF2) * uint8_t(f * 255);
      # Starting up, no Wi-Fi yet: warm white.
      - addressable_lambda:
          name: "Starting Offline"
          update_interval: 100ms
          lambda: |-
            it[0] = Color(0xFFE3B5);
      # Wi-Fi or the app lost: a red pulse.
      - addressable_lambda:
          name: "Disconnected"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 2000.0f);
            it[0] = Color(0xFF0000) * uint8_t(f * 255);
      # The XMOS board failed: solid red.
      - addressable_lambda:
          name: "Failed"
          update_interval: 100ms
          lambda: |-
            it[0] = Color(0xFF0000);
      # Factory reset hold: red blink while it is coming up, solid red once
      # it is confirmed.
      - addressable_lambda:
          name: "Reset Coming Up"
          update_interval: 20ms
          lambda: |-
            it[0] = (millis() / 200) % 2 ? Color(0xFF0000) : Color::BLACK;
      - addressable_lambda:
          name: "Reset Confirmed"
          update_interval: 100ms
          lambda: |-
            it[0] = Color(0xFF0000);
      # XMOS firmware update: grey pulse, then a green or a red fast pulse.
      - addressable_lambda:
          name: "Updating"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 2000.0f);
            it[0] = Color(0x808080) * uint8_t(f * 255);
      - addressable_lambda:
          name: "Updated"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 400.0f);
            it[0] = Color(0x00FF00) * uint8_t(f * 255);
      - addressable_lambda:
          name: "Update Failed"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 400.0f);
            it[0] = Color(0xFF0000) * uint8_t(f * 255);
      # Waiting for the answer the app asked for: a slow pulse.
      - addressable_lambda:
          name: "Waiting for Command"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 2000.0f);
            it[0] = Color(uint32_t(${call_rgb})) * uint8_t(f * 255);
      # A wake word, until the app verified it: solid.
      - addressable_lambda:
          name: "Heard"
          update_interval: 20ms
          lambda: |-
            it[0] = Color(uint32_t(${call_rgb}));
      # Listening: a 1 s pulse.
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 1000.0f);
            it[0] = Color(uint32_t(${call_rgb})) * uint8_t(f * 255);
      # Thinking: a fast pulse.
      - addressable_lambda:
          name: "Thinking"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 400.0f);
            it[0] = Color(uint32_t(${call_rgb})) * uint8_t(f * 255);
      # Replying, or another satellite's announcement: breathing between half
      # and full.
      - addressable_lambda:
          name: "Replying"
          update_interval: 20ms
          lambda: |-
            const float f = 0.75f - 0.25f * cosf(millis() * 6.2832f / 1500.0f);
            it[0] = Color(uint32_t(${call_rgb})) * uint8_t(f * 255);
      # Another satellite answers: solid and dim (the brightness from led_show).
      - addressable_lambda:
          name: "Answered Elsewhere"
          update_interval: 20ms
          lambda: |-
            it[0] = Color(uint32_t(${call_rgb}));
      # A ringing timer: a fast blink in the LED light's color.
      - addressable_lambda:
          name: "Timer Ring"
          update_interval: 20ms
          lambda: |-
            it[0] = (millis() / 250) % 2 ? Color(uint32_t(${led_rgb})) : Color::BLACK;
      # A running timer: a slow pulse in the soonest timer's color, solid while
      # paused.
      - addressable_lambda:
          name: "Timer Tick"
          update_interval: 50ms
          lambda: |-
            const int c = !id(night) && id(timer_count) > 0 && id(timer_colors)[0] >= 0 ? id(timer_colors)[0] : ${led_rgb};
            const float f = id(timer_paused) ? 1.0f : 0.6f - 0.4f * cosf(millis() * 6.2832f / 3000.0f);
            it[0] = Color(uint32_t(c)) * uint8_t(f * 255);
      # The intercom: a 1 s blink.
      - addressable_lambda:
          name: "Intercom"
          update_interval: 20ms
          lambda: |-
            it[0] = (millis() / 500) % 2 ? Color(uint32_t(${call_rgb})) : Color::BLACK;
      # At night, how the command went: one slow green pulse, or two quick red
      # blinks.
      - addressable_lambda:
          name: "Result"
          update_interval: 20ms
          lambda: |-
            const uint32_t t = millis() - id(result_started_ms);
            if (id(result_ok)) {
              const float f = t < 1000 ? sinf(t * 3.1416f / 1000.0f) : 0.0f;
              it[0] = Color(0x00FF00) * uint8_t(f * 255);
            } else {
              it[0] = (t < 600 && (t / 150) % 2 == 0) ? Color(0xFF0000) : Color::BLACK;
            }
      # Listening live (the app's Test page): a red blink.
      - addressable_lambda:
          name: "Recording"
          update_interval: 20ms
          lambda: |-
            it[0] = (millis() / 500) % 2 ? Color(0xFF0000) : Color::BLACK;
      # Muted: solid red.
      - addressable_lambda:
          name: "Muted"
          update_interval: 100ms
          lambda: |-
            it[0] = Color(0xFF0000);

  # The LED light that Home Assistant sees. When it is on, it shows when
  # nothing else does. Its color and brightness are the LED's.
  - platform: partition
    id: led_respeaker_onboard
    name: LED Respeaker onboard
    entity_category: config
    icon: "mdi:circle-outline"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - script.execute: control_leds
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: led_internal
        from: 0
        to: 0
