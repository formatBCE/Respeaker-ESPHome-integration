# =============================================================================
# Voice Incubator — media player package
#
# Replaces packages/core/media-player.yaml: the same media sources, media
# players, and Sendspin. The app's speech follows the media player's volume,
# and the app hears when a Home Assistant announcement starts and ends.
# =============================================================================

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
  - platform: sendspin
    id: sendspin_media_source
    codecs: [FLAC, PCM]  # Prefer FLAC for Sendspin
    fixed_delay: 480 microseconds  # The AIC3204 DAC used, as configured, on the VPE delays audio by 480 microseconds

media_player:
  - platform: sendspin
    id: sendspin_group_media_player
  - platform: speaker_source
    id: external_media_player
    name: Media Player
    announcement_pipeline:
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
      sample_rate: 48000
      speaker: announcement_resampling_speaker
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 2
      sample_rate: 48000
      speaker: media_resampling_speaker
      sources:
        - http_media_source
        - sendspin_media_source
    volume_increment: 0.05
    volume_min: ${volume_min}
    volume_max: ${volume_max}
    # However the volume changes, the app's speech follows.
    on_volume:
      - script.execute: sync_call_volume
    on_mute:
      - script.execute: sync_call_volume
    on_unmute:
      - script.execute: sync_call_volume
    # The app hears when an announcement starts and ends. It does not hear
    # about this satellite's own sounds, which it did not ask for.
    on_announcement:
      - if:
          condition:
            lambda: return !id(playing_sound);
          then:
            - lambda: id(announcing) = true;
            - voice_incubator.send_event: announcing
      - script.execute: duck_music
    on_state:
      - if:
          condition:
            not:
              media_player.is_announcing: external_media_player
          then:
            - if:
                condition:
                  lambda: return id(announcing);
                then:
                  - lambda: id(announcing) = false;
                  - voice_incubator.send_event: announced
            - lambda: id(playing_sound) = false;
            - script.execute: duck_music
