# =============================================================================
# Voice Incubator — Koala Satellite device package
#
# The Koala hardware on top of the ReSpeaker Lite board: the flash size, the
# user button and dial pins, the LED ring, and the onboard LEDs. Each LED state
# of the core is one effect of the same name on voice_assistant_leds, as on the
# Voice PE ring, scaled to the ring's size. The effects take their color from
# the call (the recognized speaker) or from the "LED Ring" light.
#
# The dial sets the volume of the media player, and with it the app's speech.
# The ring shows the volume meanwhile.
# =============================================================================

substitutions:
  incubator_model: koala
  # Pins of the ESP32-S3 board. The defaults are for the ESP32-S3 DevKitC that
  # the assembly guide uses. For another board, set your own values in your
  # configuration. The ReSpeaker Lite pins are fixed and are not here.
  user_button_pin: GPIO42
  led_ring_pin: GPIO13
  dial_a_pin: GPIO47       # KY-040 CLK
  dial_b_pin: GPIO21       # KY-040 DT
  dial_button_pin: GPIO20  # KY-040 SW
  esp_onboard_led_pin: GPIO48
  # Set to "true" to toggle the speaker mute with a press of the dial. Keep
  # "false" on the DevKitC: GPIO20 is a USB pin of the ESP32-S3, and noise on
  # it gives false presses.
  dial_button_mutes_speaker: "false"
  # The LED Ring light's color as 0xRRGGBB: amber at night, but for a ringing
  # timer.
  ring_rgb: "(id(night) && !id(timer_ringing) ? 0xFF4000 : int(id(led_ring).current_values.get_red() * 255) << 16 | int(id(led_ring).current_values.get_green() * 255) << 8 | int(id(led_ring).current_values.get_blue() * 255))"
  # A call's color: the recognized speaker's, else the ring's.
  call_rgb: "(id(speaker_rgb) >= 0 && !id(night) ? id(speaker_rgb) : ${ring_rgb})"

esphome:
  name: koala-satellite
  friendly_name: Koala Satellite
  name_add_mac_suffix: true
  project:
    name: formatbce.Koala Incubator
    version: dev

esp32:
  flash_size: 16MB
  framework:
    advanced:
      # Link only the generic flash driver to save IRAM. ESP-IDF falls back to
      # it for any vendor, so a DevKitC clone with other flash still boots.
      flash_chip: generic

ota:
  - platform: esphome
    id: ota_esphome

globals:
  # Position of the spinning LEDs, shared so switching effects does not jump.
  - id: global_led_animation_index
    type: int
    restore_value: no
    initial_value: '0'
  # The dial was turned in the last second: the ring shows the volume.
  - id: volume_shown
    type: bool
    restore_value: no
    initial_value: 'false'

binary_sensor:
  - platform: gpio
    id: user_button
    pin:
      number: ${user_button_pin}
      inverted: true
    name: "User button"
  # The dial press. On the DevKitC it is on GPIO20, a USB pin of the ESP32-S3,
  # and it gives false presses there. dial_button_mutes_speaker enables it.
  - platform: gpio
    id: rotary_button
    disabled_by_default: true
    pin:
      number: ${dial_button_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    on_press:
      - if:
          condition:
            lambda: return ${dial_button_mutes_speaker} && !id(init_in_progress);
          then:
            - if:
                condition:
                  lambda: return id(external_media_player).is_muted();
                then:
                  - media_player.unmute: external_media_player
                else:
                  - media_player.mute: external_media_player

sensor:
  - platform: rotary_encoder
    id: dial
    pin_a: ${dial_a_pin}
    pin_b: ${dial_b_pin}
    resolution: 1
    on_clockwise:
      - script.execute:
          id: control_volume
          increase_volume: true
    on_anticlockwise:
      - script.execute:
          id: control_volume
          increase_volume: false

script:
  # A step of the dial: the volume up or down, shown on the ring for a second
  # after the last step.
  - id: control_volume
    mode: restart
    parameters:
      increase_volume: bool
    then:
      - lambda: id(volume_shown) = true;
      - if:
          condition:
            lambda: return increase_volume;
          then:
            - media_player.volume_up: external_media_player
          else:
            - media_player.volume_down: external_media_player
      - script.execute: control_leds
      - delay: 1s
      - lambda: id(volume_shown) = false;
      - script.execute: control_leds

  # Draws a core LED state, unless a failed XMOS, a factory reset hold, or the
  # volume wins.
  - id: led_show
    mode: restart
    parameters:
      state: string
    then:
      - lambda: |-
          std::string effect = state;
          if (id(respeaker).is_failed()) {
            effect = "Failed";
          } else if (id(factory_reset_phase) == 2) {
            effect = "Reset Confirmed";
          } else if (id(factory_reset_phase) == 1) {
            effect = "Reset Coming Up";
          } else if (id(volume_shown)) {
            effect = "Volume Display";
          }
          if (effect == "Idle") {
            id(voice_assistant_leds).turn_off().perform();
            // Dark at night, the LED Ring light aside.
            if (id(led_ring).remote_values.is_on() && !id(night))
              id(led_ring).turn_on().perform();
            return;
          }
          float brightness = id(night) && !id(timer_ringing)
              ? 0.2f : std::max(id(led_ring).current_values.get_brightness(), 0.2f);
          if (effect == "Answered Elsewhere") {
            brightness = id(night) ? 0.2f : 0.25f;
          } else if (effect == "Timer Tick" && id(timer_count) > 1 && !id(night)) {
            // Bright enough by day to tell the timers' colors apart.
            brightness = std::max(brightness, 0.5f);
          } else if (effect == "Failed" || effect == "Reset Confirmed" || effect == "Reset Coming Up") {
            brightness = 1.0f;
          }
          auto call = id(voice_assistant_leds).turn_on();
          call.set_brightness(brightness);
          call.set_effect(effect);
          call.perform();

respeaker_lite:
  firmware:
    on_begin:
      - light.turn_on:
          brightness: 50%
          red: 50%
          green: 50%
          blue: 50%
          id: led_respeaker_onboard
          effect: "Slow Pulse"
    on_end:
      - light.turn_on:
          brightness: 50%
          red: 0%
          green: 100%
          blue: 0%
          id: led_respeaker_onboard
          effect: "Fast Pulse"
      - delay: 3s
      - light.turn_off:
          id: led_respeaker_onboard
    on_error:
      - light.turn_on:
          brightness: 50%
          red: 100%
          green: 0%
          blue: 0%
          id: led_respeaker_onboard
          effect: "Fast Pulse"
      - delay: 3s
      - light.turn_off:
          id: led_respeaker_onboard

light:
  - platform: esp32_rmt_led_strip
    id: leds_internal
    pin: ${led_ring_pin}
    chipset: WS2812
    max_refresh_rate: 15ms
    num_leds: 43
    channel_colors: GRB
    rmt_symbols: 96
    default_transition_length: 0ms
    color_correct: [70%, 70%, 70%]

  # The ring as the device drives it. Not exposed.
  - platform: partition
    id: voice_assistant_leds
    internal: true
    default_transition_length: 0ms
    segments:
      - id: leds_internal
        from: 0
        to: 31
        reversed: true
      - id: leds_internal
        from: 32
        to: 42
        reversed: true
    effects:
      # Wi-Fi is given over Bluetooth: the ring pulses warm white.
      - addressable_lambda:
          name: "Improv"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 2000.0f);
            it.all() = Color(0xFFE3B5) * uint8_t(f * 255);
      # Starting up, on Wi-Fi: the ring pulses blue.
      - addressable_lambda:
          name: "Starting"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 2000.0f);
            it.all() = Color(0x18BBF2) * uint8_t(f * 255);
      # Starting up, no Wi-Fi yet: warm white.
      - addressable_lambda:
          name: "Starting Offline"
          update_interval: 100ms
          lambda: |-
            it.all() = Color(0xFFE3B5);
      # Wi-Fi or the app lost: the ring pulses red.
      - addressable_lambda:
          name: "Disconnected"
          update_interval: 20ms
          lambda: |-
            const float f = 0.5f - 0.5f * cosf(millis() * 6.2832f / 2000.0f);
            it.all() = Color(0xFF0000) * uint8_t(f * 255);
      # The XMOS board failed: every third LED red.
      - addressable_lambda:
          name: "Failed"
          update_interval: 100ms
          lambda: |-
            for (int i = 0; i < it.size(); i++)
              it[i] = i % 3 ? Color::BLACK : Color(0xFF0000);
      # Factory reset hold: the ring fills with red, one LED a second, then
      # solid red once it is confirmed.
      - addressable_lambda:
          name: "Reset Coming Up"
          update_interval: 1s
          lambda: |-
            static int index = 0;
            if (initial_run)
              index = 0;
            for (int i = 0; i < it.size(); i++)
              it[i] = i <= index ? Color(0xFF0000) : Color::BLACK;
            index = (index + 1) % it.size();
      - addressable_lambda:
          name: "Reset Confirmed"
          update_interval: 100ms
          lambda: |-
            it.all() = Color(0xFF0000);
      # Slow clockwise spin, two heads: the app asked something back, and the
      # microphone is open for the answer.
      - addressable_lambda:
          name: "Waiting for Command"
          update_interval: 100ms
          lambda: |-
            const int n = it.size();
            const int head = id(global_led_animation_index) % n;
            const Color color = Color(uint32_t(${call_rgb}));
            it.all() = Color::BLACK;
            for (int k = 0; k < 4; k++) {
              const uint8_t level = 255 - k * 64;
              it[(head - k + n) % n] = color * level;
              it[(head + n / 2 - k + n) % n] = color * level;
            }
            id(global_led_animation_index) = (head + 1) % n;
      # A wake word, until the app verified it: the spin's frame stands still
      # and fades in. One that the app refuses never moves.
      - addressable_lambda:
          name: "Heard"
          update_interval: 20ms
          lambda: |-
            static uint32_t started = 0;
            if (initial_run)
              started = millis();
            const float t = std::min(1.0f, (millis() - started) / 400.0f);
            const int n = it.size();
            const int head = id(global_led_animation_index) % n;
            const Color color = Color(uint32_t(${call_rgb})) * uint8_t(255.0f * t * t);
            it.all() = Color::BLACK;
            for (int k = 0; k < 4; k++) {
              const uint8_t level = 255 - k * 64;
              it[(head - k + n) % n] = color * level;
              it[(head + n / 2 - k + n) % n] = color * level;
            }
      # Fast clockwise spin: the command is spoken.
      - addressable_lambda:
          name: "Listening For Command"
          update_interval: 30ms
          lambda: |-
            const int n = it.size();
            const int head = id(global_led_animation_index) % n;
            const Color color = Color(uint32_t(${call_rgb}));
            it.all() = Color::BLACK;
            for (int k = 0; k < 4; k++) {
              const uint8_t level = 255 - k * 64;
              it[(head - k + n) % n] = color * level;
              it[(head + n / 2 - k + n) % n] = color * level;
            }
            id(global_led_animation_index) = (head + 1) % n;
      # The spin stops and the two heads pulse: the command is processed.
      - addressable_lambda:
          name: "Thinking"
          update_interval: 20ms
          lambda: |-
            const int n = it.size();
            const int head = id(global_led_animation_index) % n;
            const float f = 0.5f + 0.5f * cosf(millis() * 6.2832f / 400.0f);
            const Color color = Color(uint32_t(${call_rgb})) * uint8_t(f * 255);
            it.all() = Color::BLACK;
            it[head] = color;
            it[(head + n / 2) % n] = color;
      # Anticlockwise spin: the response plays, or another satellite's
      # announcement.
      - addressable_lambda:
          name: "Replying"
          update_interval: 30ms
          lambda: |-
            const int n = it.size();
            const int head = (id(global_led_animation_index) - 1 + n) % n;
            id(global_led_animation_index) = head;
            const Color color = Color(uint32_t(${call_rgb}));
            it.all() = Color::BLACK;
            for (int k = 0; k < 4; k++) {
              const uint8_t level = 255 - k * 64;
              it[(head + k) % n] = color * level;
              it[(head + n / 2 + k) % n] = color * level;
            }
      # Another satellite answers: the whole ring, dim (the brightness from
      # led_show).
      - addressable_lambda:
          name: "Answered Elsewhere"
          update_interval: 50ms
          lambda: |-
            it.all() = Color(uint32_t(${ring_rgb}));
      # A ringing timer: the whole ring pulses, with the two red LEDs while
      # muted.
      - addressable_lambda:
          name: "Timer Ring"
          update_interval: 20ms
          lambda: |-
            const int n = it.size();
            const float f = 0.5f + 0.5f * cosf(millis() * 6.2832f / 400.0f);
            it.all() = Color(uint32_t(${ring_rgb})) * uint8_t(f * 255);
            if (id(mic_mute_switch).state) {
              it[n / 4] = Color(0xFF0000);
              it[3 * n / 4] = Color(0xFF0000);
            }
      # The running timers, each in its color as far as it runs: the whole ring
      # is the longest one's length, and the sooner ones lie on top. Only the
      # last fades out as it runs down. A dimmer LED steps round once a second
      # through the soonest. Muted, the two red LEDs show over it.
      - addressable_lambda:
          name: "Timer Tick"
          update_interval: 100ms
          lambda: |-
            const int n = it.size();
            static uint32_t last_step = 0;
            const uint32_t now = millis();
            float elapsed = 0.0f;
            if (!id(timer_paused)) {
              elapsed = (now - id(timer_received_ms)) / 1000.0f;
              if (now - last_step >= 1000) {
                last_step = now;
                id(global_led_animation_index) = (id(global_led_animation_index) + 1) % n;
              }
            }
            const int count = id(timer_count);
            const float scale = std::max(id(timer_scale_s), 1.0f);
            float ends[6];
            float before = 0.0f;
            for (int k = 0; k < count; k++) {
              const float left = std::max(id(timer_lefts)[k] - elapsed, 0.0f);
              ends[k] = std::min(std::max(n * left / scale, before + 1.0f), (float) n);
              before = ends[k];
            }
            it.all() = Color::BLACK;
            for (int k = count - 1; k >= 0; k--) {
              const int rgb = id(night) || id(timer_colors)[k] < 0 ? ${ring_rgb} : id(timer_colors)[k];
              const Color color = Color(uint32_t(rgb));
              for (int i = 0; i < n && i < ends[k]; i++) {
                const float f = std::min(ends[k] - i, 1.0f);
                if (k == count - 1) {
                  it[i] = color * uint8_t(255.0f * f);
                } else if (f >= 0.5f) {
                  it[i] = color;
                }
              }
            }
            const int step = id(global_led_animation_index) % n;
            if (count > 0 && !id(timer_paused) && step + 1 < ends[0]) {
              it[step] = it[step].get() * uint8_t(230);
            }
            if (id(mic_mute_switch).state) {
              it[n / 4] = Color(0xFF0000);
              it[3 * n / 4] = Color(0xFF0000);
            }
      # The volume, while the dial turns: as much of the ring as it is; the
      # first LED red when silent.
      - addressable_lambda:
          name: "Volume Display"
          update_interval: 50ms
          lambda: |-
            const int n = it.size();
            const Color color = Color(uint32_t(${ring_rgb}));
            const float volume = id(external_media_player).volume;
            const float ratio = n * volume;
            for (int i = 0; i < n; i++)
              it[i] = i <= ratio ? color * (uint8_t) std::min(255.0f * (ratio - i), 255.0f) : Color::BLACK;
            if (volume < 0.001f || id(external_media_player).is_muted())
              it[0] = Color(0xFF0000);
      # The intercom: the whole ring blinks in its color.
      - addressable_lambda:
          name: "Intercom"
          update_interval: 50ms
          lambda: |-
            it.all() = millis() % 1000 < 500 ? Color(uint32_t(${ring_rgb})) : Color::BLACK;
      # At night, how a command went: one slow green pulse when it was done,
      # two quick red blinks when it was not.
      - addressable_lambda:
          name: "Result"
          update_interval: 20ms
          lambda: |-
            const uint32_t t = millis() - id(result_started_ms);
            float level;
            if (id(result_ok)) {
              level = t < 400 ? t / 400.0f : t < 1000 ? 1.0f - (t - 400) / 600.0f : 0.0f;
            } else {
              level = t < 150 || (t >= 300 && t < 450) ? 1.0f : 0.0f;
            }
            const Color color = id(result_ok) ? Color(0, 255, 64) : Color(255, 0, 0);
            it.all() = color * uint8_t(level * 255);
      # Listening live (the app's Test page): the whole ring blinks red.
      - addressable_lambda:
          name: "Recording"
          update_interval: 50ms
          lambda: |-
            it.all() = millis() % 1000 < 500 ? Color(0xFF0000) : Color::BLACK;
      # Muted: two red LEDs, left and right, over the LED Ring light if it is
      # on.
      - addressable_lambda:
          name: "Muted"
          update_interval: 100ms
          lambda: |-
            const int n = it.size();
            it.all() = id(led_ring).current_values.is_on() && !id(night) ? Color(uint32_t(${ring_rgb})) : Color::BLACK;
            for (int c : {n / 4, 3 * n / 4}) {
              it[(c - 1 + n) % n] = Color::BLACK;
              it[(c + 1) % n] = Color::BLACK;
              it[c] = Color(0xFF0000);
            }

  # The LED Ring light that Home Assistant sees. When it is on, it shows when
  # nothing else does. Its color and brightness are the ring's.
  - platform: partition
    id: led_ring
    name: LED Ring
    entity_category: config
    icon: "mdi:circle-outline"
    default_transition_length: 0ms
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_off:
      - script.execute: control_leds
    initial_state:
      color_mode: rgb
      brightness: 66%
      red: 9.4%
      green: 73.3%
      blue: 94.9%
    segments:
      - id: leds_internal
        from: 0
        to: 31
        reversed: true
      - id: leds_internal
        from: 32
        to: 42
        reversed: true
    effects:
      - addressable_rainbow:
          name: "Rainbow"
          width: 43

  - platform: esp32_rmt_led_strip
    id: led_respeaker_onboard
    name: LED Respeaker onboard
    disabled_by_default: true
    internal: false
    channel_colors: GRB
    pin: GPIO1
    num_leds: 1
    rmt_symbols: 48
    # Explicit timings, as on the Respeaker Lite and the Voice PE. The ws2812
    # preset sends no reset, and newer LEDs drop a frame that follows the last
    # one within 280 us (issue #88).
    bit0_high: 300ns
    bit0_low: 975ns
    bit1_high: 650ns
    bit1_low: 650ns
    reset_low: 300us
    reset_high: 0us
    max_refresh_rate: 15ms
    entity_category: config
    default_transition_length: 0s
    effects:
      - pulse:
          name: "Fast Pulse"
          transition_length: 100ms
          update_interval: 100ms
          min_brightness: 50%
          max_brightness: 100%
      - pulse:
          name: "Slow Pulse"
          transition_length: 500ms
          update_interval: 500ms
          min_brightness: 50%
          max_brightness: 100%
  - platform: esp32_rmt_led_strip
    id: led_esp_onboard
    name: LED ESP onboard
    disabled_by_default: true
    internal: false
    channel_colors: GRB
    pin: ${esp_onboard_led_pin}
    num_leds: 1
    rmt_symbols: 48
    chipset: ws2812
    entity_category: config
    default_transition_length: 0s
