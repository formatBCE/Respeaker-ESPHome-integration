# =============================================================================
# Voice Incubator — Respeaker XVF3800 package
#
# Replaces packages/xvf3800/voice-assistant.yaml and
# packages/xvf3800/timers-alarm.yaml: the beam lock, the voice direction
# sensor, the wake word gain, and the volume range and volume display of the
# media player. packages/xvf3800/leds.yaml draws the ring as on main; the
# interval of incubator/voice.yaml keeps the timer it shows current.
#
# The DSP sends the comms output (or the ASR beam, see "DSP route") on channel
# 0 for the call, and the ASR beam on channel 1 for the wake word and the
# second capture.
# =============================================================================

substitutions:
  incubator_model: respeaker-xvf3800
  # The XVF3800 always used a gain of 1 on the ASR beam. "ASR output gain"
  # raises it in the DSP.
  wake_gain_factor: "1"
  # The full volume range.
  volume_min: "0.0"
  volume_max: "1.0"

switch:
  # Beam lock. When on, the XVF3800 beam is pinned to the wake-word direction
  # until the command is spoken (the app's "processing" event). Off by default
  # because fixed-beam mode is a behavioural change worth opting into deliberately.
  - platform: template
    id: beam_lock_enabled
    name: Beam lock
    icon: "mdi:target-account"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # Without Beam lock, control_leds stops the beam poll at idle (issue #115).
    # Run it again so the poll follows the switch. Boot runs it after init.
    on_turn_on:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - script.execute: control_leds
    on_turn_off:
      - if:
          condition:
            lambda: return !id(init_in_progress);
          then:
            - script.execute: control_leds

sensor:
  # Voice Direction. The direction of the wake word in degrees, published once
  # per wake word by wake_word_start_hook, never from the 10 Hz beam poll.
  # It needs Beam lock on: without it, the beam poll stops at idle (#115).
  # force_update gives one state per wake word, also for an unchanged direction.
  - platform: template
    id: voice_direction
    name: Voice Direction
    icon: "mdi:compass-outline"
    unit_of_measurement: "°"
    accuracy_decimals: 0
    disabled_by_default: true
    force_update: true
    update_interval: never

script:
  # The thinking and replying states of packages/xvf3800/leds.yaml in the
  # color of the speaker that the app recognized. These lists add to the
  # scripts of leds.yaml, so they run after led_set_effect: the effect keeps
  # running, and only its color changes.
  - id: !extend control_leds_voice_assistant_thinking_phase
    then:
      - script.execute: show_speaker_color
  - id: !extend control_leds_voice_assistant_replying_phase
    then:
      - script.execute: show_speaker_color
  - id: show_speaker_color
    then:
      - lambda: |-
          const int rgb = id(speaker_rgb);
          if (rgb < 0)
            return;
          id(effect_color_r) = (rgb >> 16) & 0xFF;
          id(effect_color_g) = (rgb >> 8) & 0xFF;
          id(effect_color_b) = rgb & 0xFF;

  # The voice package runs this hook after a wake word started a call.
  - id: !extend wake_word_start_hook
    then:
      # Pin the AEC beam to the wake-word direction before any other sound
      # source can steal it. Gated by the user-facing switch so the feature is
      # opt-in.
      - if:
          condition:
            switch.is_on: beam_lock_enabled
          then:
            - lambda: id(respeaker).lock_beam();
      # One state per wake word, after the lock, so it is the locked direction.
      - lambda: |-
          const float degrees = id(respeaker).get_azimuth_degrees();
          if (!std::isnan(degrees)) {
            id(voice_direction).publish_state(degrees);
          }

# These lists add to the triggers of the voice package, so they run after it.
voice_incubator:
  on_event:
    # A speaker's color can come without a new phase (speaker_enrolled while
    # replying). control_leds of leds.yaml repaints only on a new state, so
    # ask for it.
    - if:
        condition:
          lambda: return event_data.has("r");
        then:
          - lambda: id(led_force_update) = true;
          - script.execute: control_leds
    # Release the beam as soon as the command is over, so the stop word can
    # still hear the user from anywhere in the room during the answer.
    - if:
        condition:
          lambda: 'return event_type == "processing";'
        then:
          - lambda: id(respeaker).unlock_beam();
  on_call_end:
    # Safety-net unlock: covers a call that ended before "processing".
    # Idempotent.
    - lambda: id(respeaker).unlock_beam();

media_player:
  # The volume display on the LED ring.
  - id: !extend external_media_player
    on_mute:
      - delay: 100ms  # Debounce
      - script.execute: control_leds_volume_changed
    on_unmute:
      - delay: 100ms  # Debounce
      - script.execute: control_leds_volume_changed
    # A list, so it adds to sync_call_volume of the media player package.
    on_volume:
      - if:
          condition:
            - lambda: return !id(init_in_progress);
          then:
            - delay: 100ms  # Debounce
            - script.execute: control_leds_volume_changed
