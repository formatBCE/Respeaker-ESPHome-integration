# =============================================================================
# Respeaker XVF3800 — LED ring debug package (issue #115). Not for daily use.
#
# Finds where the random LED colors come from. Add this file to "files:" after
# config/common/respeaker-xvf-satellite-base.yaml (or the incubator base), and
# set respeaker_lite_ref to the debug branch, so the C++ component matches.
#
# What it adds:
# - Every 1 s, the driver reads the ring back from the chip and logs a WARN
#   "LED check: MISMATCH" with the sent and the read frame. It also logs the
#   chip's LED_EFFECT register once, and a WARN when that changes.
# - "Debug LED Refresh": how often an unchanged frame is sent again. 1000 ms is
#   the release value. 50 ms sends every animation tick, so a fault caused by
#   writes shows ~20x more often. 600000 ms stops the idle writes in practice.
# - Switches that stop the read-back and the two fast I2C polls, to see which
#   traffic the flashes need.
#
# Every minute the log shows "LED check: N read-backs, M mismatches, S stale,
# LED_EFFECT E". "Debug LED Read-back" off stops this line. If this line is missing, the chip does not answer the read,
# and the test is void. LED_EFFECT -1 means the effect read gets no answer.
#
# Reading the result, with the ring off and idle:
# - Flash, no MISMATCH: the chip holds the right (dark) frame, so the fault is
#   between the chip and the LEDs.
# - MISMATCH: the chip took another frame than the one sent. The read bytes
#   show what it took.
# - LED_EFFECT changed: the chip's own effect engine took over the ring.
# =============================================================================

# The switches below keep their state across a reboot, so a boot can run with
# a poll off. A switch restores before the pollers start, and a poller start
# undoes a suspend. So apply the states again here, after the pollers started
# (priority 600) and before the boot LED effects (priority 375).
esphome:
  on_boot:
    - priority: 500
      then:
        - lambda: |-
            id(respeaker).set_led_verify_each_write(id(debug_verify_each_write).state);
            id(respeaker).set_led_quiet_ms((uint32_t) id(debug_led_quiet).state);
            if (!id(debug_readback).state) id(debug_led_check_interval).stop_poller();
            if (!id(debug_beam_poll).state) id(beam_direction).stop_poller();
            if (!id(debug_mute_button_poll).state) id(mute_button).stop_poller();
            ESP_LOGI("debug_leds", "Boot: verify each write %s, read-back %s, beam poll %s, mute button poll %s",
                     ONOFF(id(debug_verify_each_write).state), ONOFF(id(debug_readback).state),
                     ONOFF(id(debug_beam_poll).state), ONOFF(id(debug_mute_button_poll).state));

interval:
  - interval: 1s
    id: debug_led_check_interval
    then:
      - lambda: id(respeaker).verify_led_ring();

number:
  # The quiet window after each LED write, in which the polls wait instead of
  # reading (issue #115). 0 turns it off. The release value is 20 ms. Keep it
  # below 50 ms, the animation frame time, or the polls wait for long.
  - platform: template
    name: "Debug LED Quiet Window"
    id: debug_led_quiet
    icon: mdi:bug
    entity_category: config
    unit_of_measurement: ms
    mode: box
    min_value: 0
    max_value: 45
    step: 5
    initial_value: 20
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(respeaker).set_led_quiet_ms((uint32_t) x);
  - platform: template
    name: "Debug LED Refresh"
    id: debug_led_refresh
    icon: mdi:bug
    entity_category: config
    unit_of_measurement: ms
    mode: box
    min_value: 50
    max_value: 600000
    step: 50
    initial_value: 1000
    optimistic: true
    restore_value: false
    on_value:
      - lambda: id(respeaker).set_led_refresh_ms((uint32_t) x);

switch:
  # On: read the ring back after every write. An animation sends a frame every
  # 50 ms, so a bad frame lives 50 ms and the 1 s check almost never sees it.
  # This doubles the LED bus traffic, and the read right after each write
  # ignores the quiet window. Keep it off for normal use. "stale" in the
  # summary counts reads that still showed the frame before the last one: the
  # chip applies it later.
  - platform: template
    name: "Debug LED Verify Every Write"
    id: debug_verify_each_write
    icon: mdi:bug
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - lambda: id(respeaker).set_led_verify_each_write(true);
    turn_off_action:
      - lambda: id(respeaker).set_led_verify_each_write(false);
  - platform: template
    name: "Debug LED Read-back"
    id: debug_readback
    icon: mdi:bug
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - component.resume: debug_led_check_interval
    turn_off_action:
      - component.suspend: debug_led_check_interval
  # Off: no azimuth reads (10 Hz). Beam lock and the beam LED effect stop.
  # control_leds starts and stops this poll on every phase change, so this
  # switch holds only until the next phase change.
  - platform: template
    name: "Debug Beam Poll"
    id: debug_beam_poll
    icon: mdi:bug
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - component.resume: beam_direction
    turn_off_action:
      - component.suspend: beam_direction
  # Off: no Mute button reads (20 Hz). The hardware mute still works; the
  # factory reset hold and the Improv authorization do not.
  - platform: template
    name: "Debug Mute Button Poll"
    id: debug_mute_button_poll
    icon: mdi:bug
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - component.resume: mute_button
    turn_off_action:
      - component.suspend: mute_button
