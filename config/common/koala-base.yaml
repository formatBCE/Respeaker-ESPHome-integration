# =============================================================================
# Koala Satellite — all packages (Voice Incubator branch)
#
# On this branch the satellite is a Voice Incubator satellite: the
# voice_incubator component replaces the Home Assistant voice pipeline. User
# configurations select it with respeaker_lite_ref: voice_incubator.
#
# The order is important: a later package overrides a value of an earlier one.
# =============================================================================

packages:
  incubator_core: !include ../../packages/incubator/core.yaml
  respeaker_lite_hardware: !include ../../packages/respeaker-lite/hardware.yaml
  incubator_call_speaker: !include ../../packages/incubator/call-speaker.yaml
  incubator_respeaker_lite: !include ../../packages/incubator/respeaker-lite.yaml
  koala_device: !include ../../packages/incubator/koala.yaml
