# =============================================================================
# Respeaker XVF3800 voice satellite — all packages (Voice Incubator branch)
#
# On this branch the satellite is a Voice Incubator satellite: the
# voice_incubator component replaces the Home Assistant voice pipeline. User
# configurations select it with respeaker_lite_ref: voice_incubator. It holds
# no credentials, so a remote import works without secrets.
#
# The order is important: the core comes first, so a value in the XVF3800
# packages wins. call-speaker.yaml comes after the hardware package.
# =============================================================================

packages:
  incubator_core: !include ../../packages/incubator/core.yaml
  base: !include ../../packages/xvf3800/base.yaml
  hardware: !include ../../packages/xvf3800/hardware.yaml
  incubator_call_speaker: !include ../../packages/incubator/call-speaker.yaml
  incubator_xvf3800: !include ../../packages/incubator/xvf3800.yaml
