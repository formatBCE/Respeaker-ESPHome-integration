# =============================================================================
# Respeaker XVF3800 voice satellite — all packages, Voice Incubator firmware
#
# The satellite of the Voice Incubator app
# (https://github.com/OHF-Voice/app-voice-incubator). The hardware and device
# packages are the same as in respeaker-xvf-satellite-base.yaml. The incubator
# packages replace the voice assistant, the timers and the alarm, and the media
# player of the core. The app keeps the wake words, the timers and the alarms.
#
# The order is important: a later package overrides a value of an earlier one.
# call-speaker.yaml comes after the hardware package.
# =============================================================================

substitutions:
  # What the device tells the Voice Incubator app it is.
  incubator_model: respeaker-xvf3800

esphome:
  project:
    name: formatbce.Respeaker XVF3800 Incubator

packages:
  core_base: !include ../../packages/core/base.yaml
  incubator_voice: !include ../../packages/incubator/voice.yaml
  incubator_media_player: !include ../../packages/incubator/media-player.yaml
  base: !include ../../packages/xvf3800/base.yaml
  hardware: !include ../../packages/xvf3800/hardware.yaml
  incubator_call_speaker: !include ../../packages/incubator/call-speaker.yaml
  leds: !include ../../packages/xvf3800/leds.yaml
  incubator_xvf3800: !include ../../packages/incubator/xvf3800.yaml
