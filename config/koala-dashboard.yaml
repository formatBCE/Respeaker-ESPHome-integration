# Configuration for your own ESPHome dashboard. Copy only this file.
# It gets the Koala firmware from GitHub. You do not need other files.

substitutions:
  # Release of the Koala firmware. To update the device, set a newer release.
  # Keep the name respeaker_lite_ref. The packages read it to select the
  # components, the firmware, and the sounds. Under another name, they use
  # their own default release.
  respeaker_lite_ref: 2026.11.2

packages:
  koala:
    url: https://github.com/formatBCE/Respeaker-ESPHome-integration
    ref: ${respeaker_lite_ref}
    refresh: 1d
    files:
      - config/common/koala-base.yaml

esphome:
  friendly_name: Koala Satellite
  name_add_mac_suffix: false

wifi:
  ap:
    ssid: "Koala Satellite"
  ssid: !secret wifi_ssid
  password: !secret wifi_password
